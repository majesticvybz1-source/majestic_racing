*{

}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:94%;
    max-width:500px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:15px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:10;
}

button{
    font-family:Arial,sans-serif;
    font-weight:bold;
}

#pause,
#sound{
    position:fixed;
    top:45px;
    padding:9px 12px;
    border:2px solid white;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    color:white;
    z-index:20;
}

#pause{
    right:10px;
}

#sound{
    left:10px;
}

.control{
    position:fixed;

    width:105px;

    border:3px solid white;
    border-radius:22px;
    background:rgba(0,0,0,.55);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    z-index:20;
    touch-action:none;
}

#left{
    left:15px;
}

#right{
    right:15px;
}

#message{
    position:fixed;

    transform:translate(-50%,-50%);
    width:92%;
    text-align:center;
    color:white;
    text-shadow:3px 3px 6px black;
    z-index:30;
    pointer-events:none;
}

#message h1{
    font-size:36px;
    margin-bottom:10px;
}

#message p{
    font-size:17px;
}

    bottom:125px;

    border:3px solid white;
    border-radius:15px;
    background:#ffd000;
    color:#111;
    font-size:19px;
    z-index:40;
}
